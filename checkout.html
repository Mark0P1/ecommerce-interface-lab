<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - TechTrend PH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav aria-label="Main Navigation">
    <ul>
      <li><a href="landing.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="checkout.html">Checkout</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Checkout</h1>

  <section>
    <h2>Shipping Information</h2>

    <form>
      <fieldset>
        <legend>Shipping Address</legend>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="street">Street Address</label>
        <input type="text" id="street" name="street" required>

        <label for="zip">Zip Code</label>
        <input type="text" id="zip" name="zip" required>
      </fieldset>
    </form>
  </section>

  <section>
    <h2>Payment Method</h2>

    <form>
      <label>
        <input type="radio" name="payment" value="card" required>
        Credit Card
      </label>

      <label>
        <input type="radio" name="payment" value="paypal">
        PayPal
      </label>

      <button type="submit">Place Order</button>
    </form>
  </section>

  <aside>
    <h2>Order Summary</h2>

    <p>Wireless Headphones - <span class="price">2499</span></p>
    <p>Bluetooth Speaker - <span class="price">1799</span></p>

    <p>Subtotal - <span class="price">4298</span></p>
    <p>Shipping Fee - <span class="price">150</span></p>

    <p>Total - <span class="price">4448</span></p>
  </aside>
</main>
</body>
</html>
