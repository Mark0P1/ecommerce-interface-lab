<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - TechTrend PH</title>
</head>
<body>
<header>
  <nav aria-label="Main Navigation">
    <ul>
      <li><a href="landing.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="checkout.html">Checkout</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Checkout</h1>

  <section>
    <h2>Shipping Information</h2>

    <form>
      <fieldset>
        <legend>Shipping Address</legend>

        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full-name" required>

        <label for="street-address">Street Address</label>
        <input type="text" id="street-address" name="street-address" required>

        <label for="zip-code">Zip Code</label>
        <input type="text" id="zip-code" name="zip-code" required>
      </fieldset>
    </form>
  </section>

  <section>
    <h2>Payment Details</h2>

    <form>
      <label>
        <input type="radio" name="payment-method" value="credit-card" required>
        Credit Card
      </label>

      <label>
        <input type="radio" name="payment-method" value="paypal">
        PayPal
      </label>

      <button type="submit">Place Order</button>
    </form>
  </section>

  <aside>
    <h2>Order Summary</h2>

    <p>Wireless Headphones (1) - ₱2,499</p>
    <p>Bluetooth Speaker (1) - ₱1,799</p>

    <p>Subtotal: ₱4,298</p>
    <p>Shipping Fee: ₱150</p>
    <p>Total: ₱4,448</p>
  </aside>
</main>
</body>
</html>
